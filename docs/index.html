<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pony Scouting</title>
  <meta name="theme-color" content="#6f37a9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Pony Scouting" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" href="./img/favicon.png" />
  <link rel="apple-touch-icon" href="./img/apple-touch-icon.png" />
  <script>
    try { if (localStorage.theme === "dark" || (!("theme" in localStorage) && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark"); } catch (e) {}
  </script>
  <script>
    window.__errs = [];
    window.__reset = async function () {
      try { for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); } catch (e) {}
      try { for (const k of await caches.keys()) await caches.delete(k); } catch (e) {}
      location.reload();
    };
    addEventListener("error", function (e) {
      var t = e.target;
      window.__errs.push(t && (t.src || t.href) ? "failed to load file: " + (t.src || t.href) + " (or one of its modules)"
        : e.message + (e.filename ? " (" + e.filename.split("/").slice(-2).join("/") + ":" + e.lineno + ")" : ""));
    }, true);
    addEventListener("unhandledrejection", function (e) { window.__errs.push(String((e.reason && e.reason.message) || e.reason)); });
    setTimeout(function () {
      var r = document.getElementById("root");
      if (!r || r.dataset.ready === "1") return;
      r.innerHTML = '<div style="padding:2rem;font-family:system-ui,sans-serif;max-width:40rem"><h2>The app failed to start</h2>' +
        '<p>If your connection is slow, wait and reload the page. Otherwise press the button below.</p>' +
        '<pre style="white-space:pre-wrap;background:#0001;padding:.8rem;border-radius:.5rem">' + (window.__errs.join("\n") || "no errors recorded (open the F12 console)").replace(/</g, "&lt;") + '</pre>' +
        '<button onclick="__reset()" style="padding:.7rem 1rem;font-size:1rem">Reset cache and reload</button></div>';
    }, 12000);
  </script>
  <link rel="stylesheet" href="./css/theme.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div id="root"><p style="padding:2rem">loading…</p></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
